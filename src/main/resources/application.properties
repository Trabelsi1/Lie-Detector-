spring.application.name=projet

# Persist HSQLDB on disk instead of volatile in-memory defaults.
spring.datasource.url=jdbc:hsqldb:file:./data/liedetectordb;shutdown=true;hsqldb.write_delay=false
spring.datasource.driver-class-name=org.hsqldb.jdbc.JDBCDriver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.HSQLDialect
spring.jpa.show-sql=false

# Comma-separated list, for example: http://localhost:5173,http://localhost:4173
app.cors.allowed-origins=*
